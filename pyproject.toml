# 声明 vecorge-console 的打包元数据和源码映射。文件说明见 doc/mirror/pyproject.toml.md。
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vecorge-console"
version = "0.3.0"
description = "Terminal status, progress and reports for command-line tools"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["vecorge_console"]

[tool.setuptools.package-dir]
vecorge_console = "src"
